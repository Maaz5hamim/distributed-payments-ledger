global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: ledger-api
    static_configs:
      - targets: ['api:9090']
  - job_name: ledger-reconciler
    static_configs:
      - targets: ['reconciler:9090']
  - job_name: ledger-worker
    static_configs:
      - targets: ['worker:9090']
